<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Assessment 4: Sight-Singing With Mode Mixture</title>
<script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 1100px; margin: 32px auto; padding: 20px; }
  h1 { margin-bottom: 8px; }
  p { color: #555; line-height: 1.4; }
  button { padding: 10px 18px; margin: 10px 0 14px; font-size: 16px; cursor: pointer; }
  button:disabled { cursor: wait; opacity: 0.65; }
  #status { min-height: 1.4em; color: #555; }
  #notation { width: 100%; overflow-x: auto; border: 1px solid #ddd; padding: 20px; box-sizing: border-box; min-height: 180px; }
  #notation svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Performance Assessment 4: Sight-Singing With Mode Mixture</h1>
<p>Generate a melody and infer its harmonic progression from the notation.</p>
<button id="generate" disabled>Initializing notation…</button>
<div id="status" aria-live="polite"></div>
<div id="notation" aria-live="polite"></div>

<script>
function makeGenerator1(toolkit) {
// =========================================
// HARMONIC MATERIAL: C major - B diminished - C major - G major - C
// =========================================

const chordProgressions = [
  [
    ["c4","e4","g4","c5"],             // C major
    ["b3","d4","f4","ab4","b4","d5"], // B diminished
    ["c4","e4","g4","c5"],             // C major
    ["b3","d4","g4","b4","d5"],        // G major
    ["c4","e4","g4","c5"]              // Final C major
  ]
];

let chords = chordProgressions[0];

function randomChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function pitchNameToNumber(pitch) {
  const names = {
    "a3": -2, "b3": -1, "c4": 0, "c#4": 0.5, "d4": 1,
    "d#4": 1.5, "eb4": 1.5, "e4": 2, "f4": 3, "f#4": 3.5, "g4": 4,
    "g#4": 4.5, "ab4": 4.5, "a4": 5, "bb4": 5.5, "b4": 6, "c5": 7, "d5": 8,
    "e5": 9, "f5": 10
  };
  return names[pitch];
}

function numberToPitchName(number) {
  const names = {
    "-2": "a3", "-1": "b3", 0: "c4", 1: "d4", 2: "e4",
    3: "f4", 4: "g4", 5: "a4", 6: "b4", 7: "c5",
    8: "d5", 9: "e5", 10: "f5"
  };
  return names[number];
}


// =========================================
// RHYTHM CELLS
//
// Every base cell = exactly 2 beats.
// No eighth notes in the base rhythm.
// =========================================

const rhythmCells = [
  {
    weight: 5,
    notes: [
      { type: "note", beats: 2, meiDur: 2 }
    ]
  },
  {
    weight: 7,
    notes: [
      { type: "note", beats: 1, meiDur: 4 },
      { type: "note", beats: 1, meiDur: 4 }
    ]
  },
  {
    weight: 2,
    notes: [
      { type: "rest", beats: 1, meiDur: 4 },
      { type: "note", beats: 1, meiDur: 4 }
    ]
  }
];

function randomRhythmCell(excludedCell = null) {
  const availableCells =
    rhythmCells.filter(cell => cell !== excludedCell);

  const totalWeight = availableCells.reduce(
    (sum, cell) => sum + cell.weight, 0
  );

  let random = Math.random() * totalWeight;

  for (const cell of availableCells) {
    random -= cell.weight;
    if (random <= 0) {
      return {
        source: cell,
        notes: cell.notes.map(note => ({ ...note }))
      };
    }
  }

  const fallback = availableCells[0];
  return {
    source: fallback,
    notes: fallback.notes.map(note => ({ ...note }))
  };
}


// =========================================
// CHORD-TONE MELODY
//
// The C-G-C-F-minor progression constrains the base pitches.
// The final measure resolves to C4 or C5, whichever is closer.
// No tritone or sixth leaps in the base melody. Octaves remain allowed.
// =========================================

function generatePitches(measures) {
  const pitchValue = {
    "a3": -2, "b3": -1, "c4": 0, "c#4": 0.5, "d4": 1,
    "d#4": 1.5, "eb4": 1.5, "e4": 2, "f4": 3, "f#4": 3.5,
    "g4": 4, "g#4": 4.5, "ab4": 4.5, "a4": 5, "bb4": 5.5, "b4": 6,
    "c5": 7, "d5": 8, "e5": 9, "f5": 10
  };

  const rules = {
    required: [],
    force: [],
    forbid: []
  };

  // Work only with the first four measures here. Measure 5 is fixed.
  const eventsByMeasure = measures.slice(0, 4).map(measure =>
    measure.filter(event => event.type === "note")
  );

  function legalInterval(a, b) {
    const distance = Math.abs(pitchValue[b] - pitchValue[a]);
    if (distance > 3) return false;
    if (
      (a === "b4" && b === "f4") ||
      (a === "f4" && b === "b4")
    ) return false;
    if (distance === 5 || distance === 6) return false;
    return true;
  }

  function isForbidden(from, to) {
    return (rules.forbid || []).some(pair =>
      pair[0] === from && pair[1] === to
    );
  }

  function forcedNext(from) {
    const rule = (rules.force || []).find(pair => pair[0] === from);
    return rule ? rule[1] : null;
  }

  // Randomize candidate order without treating every interval equally.
  // Repeating the previous pitch remains possible, but is much less likely.
  function weightedCandidateOrder(candidates, previousPitch) {
    const remaining = [...candidates];
    const ordered = [];

    while (remaining.length) {
      const weights = remaining.map(candidate => {
        if (candidate === previousPitch) return 0.2; // strongly discourage repeats
        const distance = Math.abs(pitchValue[candidate] - pitchValue[previousPitch]);
        if (distance <= 1.5) return 1.4; // favor nearby motion
        if (distance <= 2.5) return 1.0;
        return 0.75; // still allow other legal leaps
      });

      const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
      let pick = Math.random() * totalWeight;
      let selectedIndex = weights.length - 1;

      for (let i = 0; i < weights.length; i++) {
        pick -= weights[i];
        if (pick <= 0) {
          selectedIndex = i;
          break;
        }
      }

      ordered.push(remaining.splice(selectedIndex, 1)[0]);
    }

    return ordered;
  }

  // Generate one complete four-measure skeleton by recursive backtracking.
  // Required tones are enforced as soon as possible, and all special
  // measure-boundary rules are checked using the actual boundary notes.
  const allEvents = [];
  eventsByMeasure.forEach((events, m) => {
    events.forEach((item, i) => allEvents.push({ item, m, i }));
  });

  function solve(index, previousPitch, requiredSeen) {
    if (index === allEvents.length) {
      return true;
    }

    const { item, m, i } = allEvents[index];

    let candidates = [...chords[m]];

    // First note of a later measure: apply boundary rules.
    if (i === 0 && m > 0) {
      const forced = forcedNext(previousPitch);
      if (forced !== null) {
        candidates = [forced];
      } else {
        candidates = candidates.filter(p => !isForbidden(previousPitch, p));
      }

    }

    candidates = weightedCandidateOrder(candidates, previousPitch);

    for (const candidate of candidates) {
      // Measure 1 must end on C4 or G4 so the diminished passage follows
      // one of the two specified five-pitch patterns.
      if (m === 0 && i === eventsByMeasure[0].length - 1 &&
          candidate !== "c4" && candidate !== "g4") continue;

      // Measure 3 must not contain C5.
      if (m === 2 && candidate === "c5") continue;

      if (!legalInterval(previousPitch, candidate) && index !== 0) continue;

      // Boundary-specific restrictions apply to the first note of a measure.
      if (i === 0 && m > 0) {
        const forced = forcedNext(previousPitch);
        if (forced !== null && candidate !== forced) continue;
        if (isForbidden(previousPitch, candidate)) continue;

        // Remaining boundary restriction: measure 3 E4 -> measure 4
        // cannot begin on B3 or B4.
        if (m === 3 && previousPitch === "e4" &&
            (candidate === "b3" || candidate === "b4")) continue;
        // If measure 3 ends on G4, measure 4 cannot begin on B4.
        if (m === 3 && previousPitch === "g4" && candidate === "b4") continue;
      }

      // The "last pitch of measure -> first pitch of next measure" rules
      // are checked naturally when the next event is selected.
      item.pitch = candidate;

      const nextRequiredSeen = {
        measureTwoHasAb:
          requiredSeen.measureTwoHasAb || (m === 1 && candidate === "ab4")
      };

      if (solve(index + 1, candidate, nextRequiredSeen)) return true;

      delete item.pitch;
    }

    return false;
  }

  for (let attempt = 0; attempt < 100; attempt++) {
    allEvents.forEach(x => delete x.item.pitch);

    if (solve(0, "c4", { measureTwoHasAb: false })) {
      // Final measure: resolve to C4 or C5, choosing the nearer octave.
      const lastPitch = eventsByMeasure[3][eventsByMeasure[3].length - 1].pitch;
      const semitoneValue = {
        "a3": 57, "b3": 59, "c4": 60, "c#4": 61, "d4": 62,
        "d#4": 63, "eb4": 63, "e4": 64, "f4": 65, "f#4": 66,
        "g4": 67, "g#4": 68, "ab4": 68, "a4": 69, "bb4": 70,
        "b4": 71, "c5": 72, "d5": 74, "e5": 76, "f5": 77
      };
      const finalPitch =
        Math.abs(semitoneValue[lastPitch] - semitoneValue["c4"]) <=
        Math.abs(semitoneValue[lastPitch] - semitoneValue["c5"])
          ? "c4"
          : "c5";

      measures[4][0].pitch = finalPitch;
      return;
    }
  }

  throw new Error("Could not generate a melody satisfying all constraints.");
}


// =========================================
// PASSING-TONE FILL
//
// C-E -> C-D-E
// G-E -> G-F-E
//
// Only quarter + quarter pairs are filled so the
// two-beat cell remains exactly two beats.
// =========================================

function fillThirdsWithPassingTones(measures) {
  measures.forEach((measure, measureIndex) => {
    // Measure 2 is a fixed four-quarter-note diminished arpeggio; do not ornament it.
    if (measureIndex === 1) return;
    const result = [];

    for (let i = 0; i < measure.length; i++) {
      const current = measure[i];
      const next = measure[i + 1];

      // With a 50% chance, expand an ascending diatonic fourth between
      // two quarter notes into four ascending stepwise eighth notes.
      // In F minor, C4 to F4 is spelled C4-D4-Eb4-F4.
      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.beats === 1 &&
        next.beats === 1
      ) {
        const parsePitch = pitch => {
          const match = /^([a-g])([#b]?)(-?\d+)$/.exec(pitch);
          return match ? { letter: match[1], accidental: match[2], octave: Number(match[3]) } : null;
        };
        const letterOrder = { c: 0, d: 1, e: 2, f: 3, g: 4, a: 5, b: 6 };
        const startPitch = parsePitch(current.pitch);
        const endPitch = parsePitch(next.pitch);
        const startStep = startPitch ? startPitch.octave * 7 + letterOrder[startPitch.letter] : null;
        const endStep = endPitch ? endPitch.octave * 7 + letterOrder[endPitch.letter] : null;
        const eventAfterPair = measure[i + 2];
        const followingPitch = eventAfterPair && eventAfterPair.type === "note"
          ? parsePitch(eventAfterPair.pitch)
          : null;
        const followingStep = followingPitch
          ? followingPitch.octave * 7 + letterOrder[followingPitch.letter]
          : null;
        const followingNoteSupportsFigure =
          followingStep !== null &&
          (
            Math.abs(followingStep - startStep) === 1 ||
            Math.abs(followingStep - endStep) === 1
          );

        if (
          startPitch &&
          endPitch &&
          endStep - startStep === 3 &&
          followingNoteSupportsFigure &&
          Math.random() < 0.5
        ) {
          let scaleLetters = ["c", "d", "e", "f", "g", "a", "b"];
          const sequence = [];

          for (let step = 0; step <= 3; step++) {
            const absoluteStep = startStep + step;
            const octave = Math.floor(absoluteStep / 7);
            const letter = scaleLetters[absoluteStep % 7];
            sequence.push(letter + octave);
          }

          // In the F-minor measure, spell C4-F4 as C-D-Eb-F.
          if (
            measureIndex === 3 &&
            current.pitch === "c4" &&
            next.pitch === "f4"
          ) {
            sequence[0] = "c4";
            sequence[1] = "d4";
            sequence[2] = "eb4";
            sequence[3] = "f4";
          } else {
            sequence[0] = current.pitch;
            sequence[3] = next.pitch;
          }

          sequence.forEach(pitch => {
            result.push({ type: "note", pitch, beats: 0.5, meiDur: 8 });
          });
          i++;
          continue;
        }
      }

      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.beats === 1 &&
        next.beats === 1
      ) {
        const currentNumber = pitchNameToNumber(current.pitch);
        const nextNumber = pitchNameToNumber(next.pitch);
        const cEbPair =
          (current.pitch === "c4" && next.pitch === "eb4") ||
          (current.pitch === "eb4" && next.pitch === "c4");
        const fMinorPassingPairs = measureIndex === 3 && (
          (current.pitch === "f4" && next.pitch === "ab4") ||
          (current.pitch === "ab4" && next.pitch === "f4") ||
          (current.pitch === "ab4" && next.pitch === "c5") ||
          (current.pitch === "c5" && next.pitch === "ab4")
        );

        if (
          cEbPair ||
          fMinorPassingPairs ||
          (
            Number.isInteger(currentNumber) &&
            Number.isInteger(nextNumber) &&
            Math.abs(nextNumber - currentNumber) === 2
          )
        ) {
          const passingNumber =
            (currentNumber + nextNumber) / 2;

          result.push({
            type: "note",
            pitch: current.pitch,
            beats: 0.5,
            meiDur: 8
          });

          let passingPitch = numberToPitchName(passingNumber);

          // Modal-interchange passing tones:
          // Ab4-C5 uses Bb4, while C4-Eb4 (in either direction)
          // uses D4.
          if (
            (current.pitch === "ab4" && next.pitch === "c5") ||
            (current.pitch === "c5" && next.pitch === "ab4")
          ) {
            passingPitch = "bb4";
          } else if (
            (current.pitch === "f4" && next.pitch === "ab4") ||
            (current.pitch === "ab4" && next.pitch === "f4")
          ) {
            passingPitch = "g4";
          } else if (cEbPair) {
            passingPitch = "d4";
          }

          result.push({
            type: "note",
            pitch: passingPitch,
            beats: 0.5,
            meiDur: 8
          });

          result.push({
            type: "note",
            pitch: next.pitch,
            beats: 1,
            meiDur: 4
          });

          i++;
          continue;
        }
      }

      result.push(current);
    }

    measure.length = 0;
    measure.push(...result);
  });
}


// =========================================
// NEIGHBOR-TONE FILL
//
// C-C -> C-D-C
// E-E -> E-F-E
//
// Uses eighth + eighth + quarter,
// preserving the original two-beat span.
//
// The neighbor is diatonic and may be a
// non-chord tone.
// =========================================

function addNeighborToRepeatedPitches(measures) {
  measures.forEach((measure, measureIndex) => {
    // Measure 2 is a fixed four-quarter-note diminished arpeggio; do not ornament it.
    if (measureIndex === 1) return;
    const result = [];

    for (let i = 0; i < measure.length; i++) {
      const current = measure[i];
      const next = measure[i + 1];

      // Repeated-pitch neighbor tones:
      // quarter + quarter -> eighth + eighth + quarter
      // quarter + half -> eighth + eighth + half
      // E-flat may use D; A-flat may use lower neighbor G or upper neighbor B-flat.
      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.pitch === next.pitch &&
        current.beats === 1 &&
        (next.beats === 1 || next.beats === 2)
      ) {
        let neighborCandidates = [];

        if (current.pitch === "eb4") {
          neighborCandidates = ["d4"];
        } else if (current.pitch === "ab4") {
          neighborCandidates = ["g4", "bb4"];
        } else if (!/[#b]/.test(current.pitch.slice(1))) {
          const currentNumber = pitchNameToNumber(current.pitch);
          if (Number.isFinite(currentNumber)) {
            if (currentNumber > 0) neighborCandidates.push(currentNumber - 1);
            if (currentNumber < 7) neighborCandidates.push(currentNumber + 1);
          }
          neighborCandidates = neighborCandidates.map(numberToPitchName).filter(Boolean);
        }

        const neighborPitch = randomChoice(neighborCandidates);

        if (neighborPitch) {
          result.push(
            { type: "note", pitch: current.pitch, beats: 0.5, meiDur: 8 },
            { type: "note", pitch: neighborPitch, beats: 0.5, meiDur: 8 },
            { type: "note", pitch: next.pitch, beats: next.beats, meiDur: next.meiDur }
          );
          i++;
          continue;
        }
      }

      result.push(current);
    }

    measure.length = 0;
    measure.push(...result);
  });
}


// =========================================
// COMPLETE MELODY: C - B DIMINISHED - C - G - C
// =========================================

function chooseProgression() {
  selectedProgression = 0;
  chords = chordProgressions[0];
}

function absorbBeatThreeQuarterRests(measures) {
  measures.forEach(measure => {
    let elapsedBeats = 0;

    for (let i = 0; i < measure.length; i++) {
      const event = measure[i];

      // If a quarter rest begins on beat 3, add its beat to the
      // immediately preceding note and remove the rest.
      if (
        event.type === "rest" &&
        event.beats === 1 &&
        elapsedBeats === 2 &&
        i > 0 &&
        measure[i - 1].type === "note"
      ) {
        const previous = measure[i - 1];
        previous.beats += 1;

        if (previous.beats === 2) {
          previous.meiDur = 2;
          delete previous.dots;
        } else if (previous.beats === 3) {
          previous.meiDur = 2;
          previous.dots = 1;
        }

        measure.splice(i, 1);
        i--;
        // The removed rest does not advance the measure's beat count.
        continue;
      }

      elapsedBeats += event.beats;
    }
  });
}

function createRandomMelody() {
  chooseProgression();
  const measures = [];
  let previousCell = null;

  for (let measureNumber = 0; measureNumber < 4; measureNumber++) {
    const firstChoice = randomRhythmCell(previousCell);
    const firstCell = firstChoice.notes;
    previousCell = firstChoice.source;

    let secondCell;

    const secondChoice = randomRhythmCell(previousCell);
    secondCell = secondChoice.notes;
    previousCell = secondChoice.source;

    measures.push([...firstCell, ...secondCell]);
  }

  absorbBeatThreeQuarterRests(measures);

  // Measure 2 is always four quarter notes. Its pitches are assigned after
  // the surrounding melody is generated, so it can form a clear B-diminished arpeggio.
  measures[1] = [
    { type: "note", beats: 1, meiDur: 4 },
    { type: "note", beats: 1, meiDur: 4 },
    { type: "note", beats: 1, meiDur: 4 },
    { type: "note", beats: 1, meiDur: 4 }
  ];

  // Final measure: whole-note C (tonic), with octave selected after pitch generation.
  measures.push([
    { type: "note", pitch: "c4", beats: 4, meiDur: 1 }
  ]);

  // Base harmony.
  generatePitches(measures);

  // Set the fixed diminished passage and its resolution BEFORE ornamentation,
  // so ornaments in measure 3 use the actual G4 or C4 starting pitch.
  const measureOneNotes = measures[0].filter(event => event.type === "note");
  const lastMeasureOnePitch = measureOneNotes[measureOneNotes.length - 1].pitch;
  const pattern = lastMeasureOnePitch === "c4"
    ? ["b3", "d4", "f4", "ab4"]
    : ["ab4", "f4", "d4", "b3"];

  measures[1] = pattern.map(pitch => ({
    type: "note",
    pitch,
    beats: 1,
    meiDur: 4
  }));

  const measureThreeFirstNote = measures[2].find(event => event.type === "note");
  if (measureThreeFirstNote) {
    measureThreeFirstNote.pitch = lastMeasureOnePitch === "c4" ? "g4" : "c4";
  }

  // 50% chance: connect F4 and A-flat4 in measure 2 with passing G4.
  // Preserve the direction of the arpeggio and the two-beat duration of the pair.
  if (Math.random() < 0.5) {
    const diminishedMeasure = measures[1];
    const fThenAb = diminishedMeasure.findIndex((event, i) =>
      event.type === "note" && event.pitch === "f4" &&
      diminishedMeasure[i + 1]?.type === "note" &&
      diminishedMeasure[i + 1]?.pitch === "ab4"
    );
    const abThenF = diminishedMeasure.findIndex((event, i) =>
      event.type === "note" && event.pitch === "ab4" &&
      diminishedMeasure[i + 1]?.type === "note" &&
      diminishedMeasure[i + 1]?.pitch === "f4"
    );
    const pairIndex = fThenAb >= 0 ? fThenAb : abThenF;
    if (pairIndex >= 0) {
      const first = diminishedMeasure[pairIndex];
      const second = diminishedMeasure[pairIndex + 1];
      diminishedMeasure.splice(pairIndex, 2,
        { type: "note", pitch: first.pitch, beats: 0.5, meiDur: 8 },
        { type: "note", pitch: "g4", beats: 0.5, meiDur: 8 },
        { type: "note", pitch: second.pitch, beats: 1, meiDur: 4 }
      );
    }
  }

  // Embellish only after the fixed pitches are in place. Measure 2 is skipped
  // by both ornament functions so its four quarter notes remain exact.
  fillThirdsWithPassingTones(measures);
  addNeighborToRepeatedPitches(measures);

  return measures;
}


// =========================================
// MEI HELPERS
// =========================================

function pitchToMEI(pitch) {
  const match = pitch.match(/^([a-g])([#b]?)(\d)$/);
  if (!match) {
    throw new Error(`Invalid pitch name: ${pitch}`);
  }

  return {
    pname: match[1],
    accidental: match[2],
    oct: match[3]
  };
}

function makeEvent(event) {
  if (event.type === "rest") {
    return `<rest dur="${event.meiDur}"/>`;
  }

  const pitch = pitchToMEI(event.pitch);

  let accidentalMarkup = "";
  if (pitch.accidental === "#") accidentalMarkup = ' accid="s"';
  if (pitch.accidental === "b") accidentalMarkup = ' accid="f"';

  const dotMarkup = event.dots ? ` dots="${event.dots}"` : "";

  return `
    <note
      pname="${pitch.pname}"
      oct="${pitch.oct}"
      dur="${event.meiDur}"${accidentalMarkup}${dotMarkup}
    />
  `;
}


// =========================================
// CELL RENDERING
//
// Eighth pairs are explicitly beamed.
// =========================================

function renderCell(cell) {
  let output = "";
  let i = 0;

  while (i < cell.length) {
    const event = cell[i];
    const next = cell[i + 1];

    if (
      event.type === "note" &&
      event.beats === 0.5 &&
      next &&
      next.type === "note" &&
      next.beats === 0.5
    ) {
      output += `
        <beam>
          ${makeEvent(event)}
          ${makeEvent(next)}
        </beam>
      `;
      i += 2;
      continue;
    }

    output += makeEvent(event);
    i++;
  }

  return output;
}


// =========================================
// MELODY -> MEI
// =========================================

function melodyToMEI(measures) {
  let measureMarkup = "";

  measures.forEach((measure, index) => {
    let firstCell = [];
    let secondCell = [];
    let beats = 0;

    for (const event of measure) {
      if (beats < 2) {
        firstCell.push(event);
      } else {
        secondCell.push(event);
      }
      beats += event.beats;
    }

    measureMarkup += `
      <measure n="${index + 1}">
        <staff n="1">
          <layer n="1">
            ${renderCell(firstCell)}
            ${renderCell(secondCell)}
          </layer>
        </staff>
      </measure>
    `;
  });

  return `
    <?xml version="1.0" encoding="UTF-8"?>

    <mei
      xmlns="http://www.music-encoding.org/ns/mei"
      meiversion="5.0">

    </mei>
  `;
}

// =========================================
// HARMONIC MATERIAL: C major - G major - C major - F minor - C

const chordProgressions = [

    ["b3","d4","g4","b4","d5"], // G major
    ["c4","e4","g4","c5"],       // C major
    ["c4","f4","ab4","c5"],      // F minor

  };

function numberToPitchName(number) {
  const names = {
    "-2": "a3", "-1": "b3", 0: "c4", 1: "d4", 2: "e4",

  };

// =========================================
// RHYTHM CELLS
//

const rhythmCells = [
  {

    ]
  }
];

function randomRhythmCell(excludedCell = null) {
  const availableCells =
    rhythmCells.filter(cell => cell !== excludedCell);

  const totalWeight = availableCells.reduce(
    (sum, cell) => sum + cell.weight, 0
  );

  let random = Math.random() * totalWeight;

  for (const cell of availableCells) {
    random -= cell.weight;
    if (random <= 0) {
      return {
        source: cell,
        notes: cell.notes.map(note => ({ ...note }))
      };
    }
  }

  const fallback = availableCells[0];
  return {
    source: fallback,
    notes: fallback.notes.map(note => ({ ...note }))
  };
}


// =========================================
// CHORD-TONE MELODY
//
// The C-G-C-F-minor progression constrains the base pitches.
// The final measure resolves to C4 or C5, whichever is closer.
// No tritone or sixth leaps in the base melody. Octaves remain allowed.
// =========================================

function generatePitches(measures) {
  const pitchValue = {
    "a3": -2, "b3": -1, "c4": 0, "c#4": 0.5, "d4": 1,
    "d#4": 1.5, "eb4": 1.5, "e4": 2, "f4": 3, "f#4": 3.5,
    "g4": 4, "g#4": 4.5, "ab4": 4.5, "a4": 5, "bb4": 5.5, "b4": 6,
    "c5": 7, "d5": 8, "e5": 9, "f5": 10
  };

  const rules = {
    required: [],
    force: [],
    forbid: []
  };

  // Work only with the first four measures here. Measure 5 is fixed.
  const eventsByMeasure = measures.slice(0, 4).map(measure =>
    measure.filter(event => event.type === "note")
  );

  function legalInterval(a, b) {
    const distance = Math.abs(pitchValue[b] - pitchValue[a]);
    if (distance > 3) return false;
    if (
      (a === "b4" && b === "f4") ||
      (a === "f4" && b === "b4")
    ) return false;
    if (distance === 5 || distance === 6) return false;
    return true;
  }

  function isForbidden(from, to) {
    return (rules.forbid || []).some(pair =>
      pair[0] === from && pair[1] === to
    );
  }

  function forcedNext(from) {
    const rule = (rules.force || []).find(pair => pair[0] === from);
    return rule ? rule[1] : null;
  }

  // Randomize candidate order without treating every interval equally.
  // Repeating the previous pitch remains possible, but is much less likely.
  function weightedCandidateOrder(candidates, previousPitch) {
    const remaining = [...candidates];
    const ordered = [];

    while (remaining.length) {
      const weights = remaining.map(candidate => {
        if (candidate === previousPitch) return 0.2; // strongly discourage repeats
        const distance = Math.abs(pitchValue[candidate] - pitchValue[previousPitch]);
        if (distance <= 1.5) return 1.4; // favor nearby motion
        if (distance <= 2.5) return 1.0;
        return 0.75; // still allow other legal leaps
      });

      const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
      let pick = Math.random() * totalWeight;
      let selectedIndex = weights.length - 1;

      for (let i = 0; i < weights.length; i++) {
        pick -= weights[i];
        if (pick <= 0) {
          selectedIndex = i;
          break;
        }
      }

      ordered.push(remaining.splice(selectedIndex, 1)[0]);
    }

    return ordered;
  }

  // Generate one complete four-measure skeleton by recursive backtracking.
  // Required tones are enforced as soon as possible, and all special
  // measure-boundary rules are checked using the actual boundary notes.
  const allEvents = [];
  eventsByMeasure.forEach((events, m) => {
    events.forEach((item, i) => allEvents.push({ item, m, i }));
  });

  function solve(index, previousPitch, requiredSeen) {
    if (index === allEvents.length) {
      return requiredSeen.measureFourHasAb;
    }

    const { item, m, i } = allEvents[index];

    let candidates = [...chords[m]];

    // First note of a later measure: apply boundary rules.
    if (i === 0 && m > 0) {
      const forced = forcedNext(previousPitch);
      if (forced !== null) {
        candidates = [forced];
      } else {
        candidates = candidates.filter(p => !isForbidden(previousPitch, p));
      }

    }

    candidates = weightedCandidateOrder(candidates, previousPitch);

    for (const candidate of candidates) {
      if (!legalInterval(previousPitch, candidate) && index !== 0) continue;

      // Boundary-specific restrictions apply to the first note of a measure.
      if (i === 0 && m > 0) {
        const forced = forcedNext(previousPitch);
        if (forced !== null && candidate !== forced) continue;
        if (isForbidden(previousPitch, candidate)) continue;

        // Voice-leading restrictions across this progression:
        // measure 1 ends E4 -> measure 2 cannot begin B4;
        // measure 2 ends B4 -> measure 3 cannot begin E4;
        // measure 3 ends E4 -> measure 4 cannot begin A-flat 4.
        if (m === 1 && previousPitch === "e4" && (candidate === "b4" || candidate === "b3")) continue;
        if (m === 2 && (previousPitch === "b3" || previousPitch === "b4") && candidate === "e4") continue;
        if (m === 3 && previousPitch === "e4" && candidate === "ab4") continue;
      }

      // The "last pitch of measure -> first pitch of next measure" rules
      // are checked naturally when the next event is selected.
      item.pitch = candidate;

      const nextRequiredSeen = {
        measureFourHasAb:
          requiredSeen.measureFourHasAb || (m === 3 && candidate === "ab4")
      };

      if (solve(index + 1, candidate, nextRequiredSeen)) return true;

      delete item.pitch;
    }

    return false;
  }

  for (let attempt = 0; attempt < 100; attempt++) {
    allEvents.forEach(x => delete x.item.pitch);

    if (solve(0, "c4", { measureFourHasAb: false })) {
      // Final measure: resolve to the nearest chord tone in C major.
      // Use semitone distances so F4 resolves to E4 and Ab4 resolves to G4.
      const lastPitch = eventsByMeasure[3][eventsByMeasure[3].length - 1].pitch;
      const semitoneValue = {
        "a3": 57, "b3": 59, "c4": 60, "c#4": 61, "d4": 62,
        "d#4": 63, "eb4": 63, "e4": 64, "f4": 65, "f#4": 66,
        "g4": 67, "g#4": 68, "ab4": 68, "a4": 69, "bb4": 70,
        "b4": 71, "c5": 72, "d5": 74, "e5": 76, "f5": 77
      };
      const finalChordTones = ["c4", "e4", "g4", "c5"];
      const finalPitch = finalChordTones.reduce((best, candidate) => {
        const distance = Math.abs(semitoneValue[lastPitch] - semitoneValue[candidate]);
        const bestDistance = Math.abs(semitoneValue[lastPitch] - semitoneValue[best]);
        return distance < bestDistance ? candidate : best;
      }, finalChordTones[0]);

      measures[4][0].pitch = finalPitch;
      return;
    }
  }

  throw new Error("Could not generate a melody satisfying all constraints.");
}


// =========================================
// PASSING-TONE FILL
//
// C-E -> C-D-E
// G-E -> G-F-E
//
// Only quarter + quarter pairs are filled so the
// two-beat cell remains exactly two beats.
// =========================================

function fillThirdsWithPassingTones(measures) {
  measures.forEach((measure, measureIndex) => {
    const result = [];

    for (let i = 0; i < measure.length; i++) {
      const current = measure[i];
      const next = measure[i + 1];

      // With a 50% chance, expand an ascending diatonic fourth between
      // two quarter notes into four ascending stepwise eighth notes.
      // In F minor, C4 to F4 is spelled C4-D4-Eb4-F4.
      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.beats === 1 &&
        next.beats === 1
      ) {
        const parsePitch = pitch => {
          const match = /^([a-g])([#b]?)(-?\d+)$/.exec(pitch);
          return match ? { letter: match[1], accidental: match[2], octave: Number(match[3]) } : null;
        };
        const letterOrder = { c: 0, d: 1, e: 2, f: 3, g: 4, a: 5, b: 6 };
        const startPitch = parsePitch(current.pitch);
        const endPitch = parsePitch(next.pitch);
        const startStep = startPitch ? startPitch.octave * 7 + letterOrder[startPitch.letter] : null;
        const endStep = endPitch ? endPitch.octave * 7 + letterOrder[endPitch.letter] : null;
        const eventAfterPair = measure[i + 2];
        const followingPitch = eventAfterPair && eventAfterPair.type === "note"
          ? parsePitch(eventAfterPair.pitch)
          : null;
        const followingStep = followingPitch
          ? followingPitch.octave * 7 + letterOrder[followingPitch.letter]
          : null;
        const followingNoteSupportsFigure =
          followingStep !== null &&
          (
            Math.abs(followingStep - startStep) === 1 ||
            Math.abs(followingStep - endStep) === 1
          );

        if (
          startPitch &&
          endPitch &&
          endStep - startStep === 3 &&
          followingNoteSupportsFigure &&
          Math.random() < 0.5
        ) {
          let scaleLetters = ["c", "d", "e", "f", "g", "a", "b"];
          const sequence = [];

          for (let step = 0; step <= 3; step++) {
            const absoluteStep = startStep + step;
            const octave = Math.floor(absoluteStep / 7);
            const letter = scaleLetters[absoluteStep % 7];
            sequence.push(letter + octave);
          }

          // In the F-minor measure, spell C4-F4 as C-D-Eb-F.
          if (
            measureIndex === 3 &&
            current.pitch === "c4" &&
            next.pitch === "f4"
          ) {
            sequence[0] = "c4";
            sequence[1] = "d4";
            sequence[2] = "eb4";
            sequence[3] = "f4";
          } else {
            sequence[0] = current.pitch;
            sequence[3] = next.pitch;
          }

          sequence.forEach(pitch => {
            result.push({ type: "note", pitch, beats: 0.5, meiDur: 8 });
          });
          i++;
          continue;
        }
      }

      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.beats === 1 &&
        next.beats === 1
      ) {
        const currentNumber = pitchNameToNumber(current.pitch);
        const nextNumber = pitchNameToNumber(next.pitch);
        const cEbPair =
          (current.pitch === "c4" && next.pitch === "eb4") ||
          (current.pitch === "eb4" && next.pitch === "c4");
        const fMinorPassingPairs = measureIndex === 3 && (
          (current.pitch === "f4" && next.pitch === "ab4") ||
          (current.pitch === "ab4" && next.pitch === "f4") ||
          (current.pitch === "ab4" && next.pitch === "c5") ||
          (current.pitch === "c5" && next.pitch === "ab4")
        );

        if (
          cEbPair ||
          fMinorPassingPairs ||
          (
            Number.isInteger(currentNumber) &&
            Number.isInteger(nextNumber) &&
            Math.abs(nextNumber - currentNumber) === 2
          )
        ) {
          const passingNumber =
            (currentNumber + nextNumber) / 2;

          result.push({
            type: "note",
            pitch: current.pitch,
            beats: 0.5,
            meiDur: 8
          });

          let passingPitch = numberToPitchName(passingNumber);

          // Modal-interchange passing tones:
          // Ab4-C5 uses Bb4, while C4-Eb4 (in either direction)
          // uses D4.
          if (
            (current.pitch === "ab4" && next.pitch === "c5") ||
            (current.pitch === "c5" && next.pitch === "ab4")
          ) {
            passingPitch = "bb4";
          } else if (
            (current.pitch === "f4" && next.pitch === "ab4") ||
            (current.pitch === "ab4" && next.pitch === "f4")
          ) {
            passingPitch = "g4";
          } else if (cEbPair) {
            passingPitch = "d4";
          }

          result.push({
            type: "note",
            pitch: passingPitch,
            beats: 0.5,
            meiDur: 8
          });

          result.push({
            type: "note",
            pitch: next.pitch,
            beats: 1,
            meiDur: 4
          });

          i++;
          continue;
        }
      }

      result.push(current);
    }

    measure.length = 0;
    measure.push(...result);
  });
}


// =========================================
// NEIGHBOR-TONE FILL
//
// C-C -> C-D-C
// E-E -> E-F-E
//
// Uses eighth + eighth + quarter,
// preserving the original two-beat span.
//
// The neighbor is diatonic and may be a
// non-chord tone.
// =========================================

function addNeighborToRepeatedPitches(measures) {
  measures.forEach(measure => {
    const result = [];

    for (let i = 0; i < measure.length; i++) {
      const current = measure[i];
      const next = measure[i + 1];

      // Repeated-pitch neighbor tones:
      // quarter + quarter -> eighth + eighth + quarter
      // quarter + half -> eighth + eighth + half
      // E-flat may use D; A-flat may use lower neighbor G or upper neighbor B-flat.
      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.pitch === next.pitch &&
        current.beats === 1 &&
        (next.beats === 1 || next.beats === 2)
      ) {
        let neighborCandidates = [];

        if (current.pitch === "eb4") {
          neighborCandidates = ["d4"];
        } else if (current.pitch === "ab4") {
          neighborCandidates = ["g4", "bb4"];
        } else if (measure.indexOf(current) !== -1 && current.pitch === "f4" &&
                   measure.some(event => event.pitch === "ab4")) {
          neighborCandidates = ["eb4", "g4"];
        } else if (!/[#b]/.test(current.pitch.slice(1))) {
          const currentNumber = pitchNameToNumber(current.pitch);
          if (Number.isFinite(currentNumber)) {
            if (currentNumber > 0) neighborCandidates.push(currentNumber - 1);
            if (currentNumber < 7) neighborCandidates.push(currentNumber + 1);
          }
          neighborCandidates = neighborCandidates.map(numberToPitchName).filter(Boolean);
        }

        const neighborPitch = randomChoice(neighborCandidates);

        if (neighborPitch) {
          result.push(
            { type: "note", pitch: current.pitch, beats: 0.5, meiDur: 8 },
            { type: "note", pitch: neighborPitch, beats: 0.5, meiDur: 8 },
            { type: "note", pitch: next.pitch, beats: next.beats, meiDur: next.meiDur }
          );
          i++;
          continue;
        }
      }

      result.push(current);
    }

    measure.length = 0;
    measure.push(...result);
  });
}


// =========================================
// COMPLETE MELODY: C - G - C - F MINOR - C
// =========================================

function chooseProgression() {
  selectedProgression = 0;
  chords = chordProgressions[0];
}

function absorbBeatThreeQuarterRests(measures) {
  measures.forEach(measure => {
    let elapsedBeats = 0;

    for (let i = 0; i < measure.length; i++) {
      const event = measure[i];

      // If a quarter rest begins on beat 3, add its beat to the
      // immediately preceding note and remove the rest.
      if (
        event.type === "rest" &&
        event.beats === 1 &&
        elapsedBeats === 2 &&
        i > 0 &&
        measure[i - 1].type === "note"
      ) {
        const previous = measure[i - 1];
        previous.beats += 1;

        if (previous.beats === 2) {
          previous.meiDur = 2;
          delete previous.dots;
        } else if (previous.beats === 3) {
          previous.meiDur = 2;
          previous.dots = 1;
        }

        measure.splice(i, 1);
        i--;
        // The removed rest does not advance the measure's beat count.
        continue;
      }

      elapsedBeats += event.beats;
    }
  });
}

function createRandomMelody() {
  chooseProgression();
  const measures = [];
  let previousCell = null;

  for (let measureNumber = 0; measureNumber < 4; measureNumber++) {
    const firstChoice = randomRhythmCell(previousCell);
    const firstCell = firstChoice.notes;
    previousCell = firstChoice.source;

    let secondCell;

    const secondChoice = randomRhythmCell(previousCell);
    secondCell = secondChoice.notes;
    previousCell = secondChoice.source;

    measures.push([...firstCell, ...secondCell]);
  }

  absorbBeatThreeQuarterRests(measures);

  // Final measure: whole-note C (tonic), with octave selected after pitch generation.
  measures.push([
    { type: "note", pitch: "c4", beats: 4, meiDur: 1 }
  ]);

  // Base harmony.
  generatePitches(measures);

  // Embellishment layer.
  fillThirdsWithPassingTones(measures);
  addNeighborToRepeatedPitches(measures);

  return measures;
}


// =========================================
// MEI HELPERS
// =========================================

function pitchToMEI(pitch) {
  const match = pitch.match(/^([a-g])([#b]?)(\d)$/);
  if (!match) {
    throw new Error(`Invalid pitch name: ${pitch}`);
  }

  return {
    pname: match[1],
    accidental: match[2],
    oct: match[3]
  };
}

function makeEvent(event) {
  if (event.type === "rest") {
    return `<rest dur="${event.meiDur}"/>`;
  }

  const pitch = pitchToMEI(event.pitch);

  let accidentalMarkup = "";
  if (pitch.accidental === "#") accidentalMarkup = ' accid="s"';
  if (pitch.accidental === "b") accidentalMarkup = ' accid="f"';

  const dotMarkup = event.dots ? ` dots="${event.dots}"` : "";

  return `
    <note
      pname="${pitch.pname}"
      oct="${pitch.oct}"
      dur="${event.meiDur}"${accidentalMarkup}${dotMarkup}
    />
  `;
}


// =========================================
// CELL RENDERING
//
// Eighth pairs are explicitly beamed.
// =========================================

function renderCell(cell) {
  let output = "";
  let i = 0;

  while (i < cell.length) {
    const event = cell[i];
    const next = cell[i + 1];

    if (
      event.type === "note" &&
      event.beats === 0.5 &&
      next &&
      next.type === "note" &&
      next.beats === 0.5
    ) {
      output += `
        <beam>
          ${makeEvent(event)}
          ${makeEvent(next)}
        </beam>
      `;
      i += 2;
      continue;
    }

    output += makeEvent(event);
    i++;
  }

  return output;
}


// =========================================
// MELODY -> MEI
// =========================================

function melodyToMEI(measures) {
  let measureMarkup = "";

  measures.forEach((measure, index) => {
    let firstCell = [];
    let secondCell = [];
    let beats = 0;

    for (const event of measure) {
      if (beats < 2) {
        firstCell.push(event);
      } else {
        secondCell.push(event);
      }
      beats += event.beats;
    }

    measureMarkup += `
      <measure n="${index + 1}">
        <staff n="1">
          <layer n="1">
            ${renderCell(firstCell)}
            ${renderCell(secondCell)}
          </layer>
        </staff>
      </measure>
    `;
  });

  return `
    <?xml version="1.0" encoding="UTF-8"?>

    <mei
      xmlns="http://www.music-encoding.org/ns/mei"
      meiversion="5.0">

      <meiHead>
        <fileDesc>
          <titleStmt>
            <title>Random Melody</title>
          </titleStmt>
          <pubStmt/>
        </fileDesc>
      </meiHead>

      <music>
        <body>
          <mdiv>
            <score>
              <scoreDef meter.count="4" meter.unit="4">
                <staffGrp>
                  <staffDef
                    n="1"
                    lines="5"
                    clef.shape="G"
                    clef.line="2"
                  />
                </staffGrp>
              </scoreDef>

              <section>
                ${measureMarkup}
              </section>
            </score>
          </mdiv>
        </body>
      </music>
    </mei>
  `;
}

function makeGenerator3(toolkit) {
// =========================================

  return array[Math.floor(Math.random() * array.length)];
}

function pitchNameToNumber(pitch) {
  const names = {
    "a3": -2, "b3": -1, "c4": 0, "c#4": 0.5, "d4": 1,
    "d#4": 1.5, "eb4": 1.5, "e4": 2, "f4": 3, "f#4": 3.5, "g4": 4,
    "g#4": 4.5, "ab4": 4.5, "a4": 5, "bb4": 5.5, "b4": 6, "c5": 7, "d5": 8,
    "e5": 9, "f5": 10
  };
  return names[pitch];
}

function numberToPitchName(number) {
  const names = {
    "-2": "a3", "-1": "b3", 0: "c4", 1: "d4", 2: "e4",
    3: "f4", 4: "g4", 5: "a4", 6: "b4", 7: "c5",
    8: "d5", 9: "e5", 10: "f5"
  };
  return names[number];
}


// =========================================
// RHYTHM CELLS
//
// Every base cell = exactly 2 beats.
// No eighth notes in the base rhythm.
// =========================================

const rhythmCells = [
  {
    weight: 5,
    notes: [
      { type: "note", beats: 2, meiDur: 2 }
    ]
  },
  {
    weight: 7,
    notes: [
      { type: "note", beats: 1, meiDur: 4 },
      { type: "note", beats: 1, meiDur: 4 }
    ]
  },
  {
    weight: 2,
    notes: [
      { type: "rest", beats: 1, meiDur: 4 },
      { type: "note", beats: 1, meiDur: 4 }
    ]
  }
];

function randomRhythmCell(excludedCell = null) {
  const availableCells =
    rhythmCells.filter(cell => cell !== excludedCell);

  const totalWeight = availableCells.reduce(
    (sum, cell) => sum + cell.weight, 0
  );

  let random = Math.random() * totalWeight;

  for (const cell of availableCells) {
    random -= cell.weight;
    if (random <= 0) {
      return {
        source: cell,
        notes: cell.notes.map(note => ({ ...note }))
      };
    }
  }

  const fallback = availableCells[0];
  return {
    source: fallback,
    notes: fallback.notes.map(note => ({ ...note }))
  };
}


// =========================================
// CHORD-TONE MELODY
//
// Only the I-bVI-IV-V-I harmony constrains the
// base pitches, plus tonic beginning/ending.
// No 2nd/3rd or scale-degree-7 rule here.
// No tritone or sixth leaps in the base melody.
// Octaves remain allowed.
// =========================================

function generatePitches(measures) {
  const pitchValue = {
    "a3": -2, "b3": -1, "c4": 0, "c#4": 0.5, "d4": 1,
    "d#4": 1.5, "eb4": 1.5, "e4": 2, "f4": 3, "f#4": 3.5,
    "g4": 4, "g#4": 4.5, "ab4": 4.5, "a4": 5, "bb4": 5.5, "b4": 6,
    "c5": 7, "d5": 8, "e5": 9, "f5": 10
  };

  const rules = {
    required: ["eb4"],
    force: [],
    forbid: []
  };

  // Work only with the first four measures here. Measure 5 is fixed.
  const eventsByMeasure = measures.slice(0, 4).map(measure =>
    measure.filter(event => event.type === "note")
  );

  function legalInterval(a, b) {
    const distance = Math.abs(pitchValue[b] - pitchValue[a]);
    if (distance > 3) return false;
    if (
      (a === "b4" && b === "f4") ||
      (a === "f4" && b === "b4")
    ) return false;
    if (distance === 5 || distance === 6) return false;
    return true;
  }

  function isForbidden(from, to) {
    return (rules.forbid || []).some(pair =>
      pair[0] === from && pair[1] === to
    );
  }

  function forcedNext(from) {
    const rule = (rules.force || []).find(pair => pair[0] === from);
    return rule ? rule[1] : null;
  }

  // Randomize candidate order without treating every interval equally.
  // Repeating the previous pitch remains possible, but is much less likely.
  function weightedCandidateOrder(candidates, previousPitch) {
    const remaining = [...candidates];
    const ordered = [];

    while (remaining.length) {
      const weights = remaining.map(candidate => {
        if (candidate === previousPitch) return 0.2; // strongly discourage repeats
        const distance = Math.abs(pitchValue[candidate] - pitchValue[previousPitch]);
        if (distance <= 1.5) return 1.4; // favor nearby motion
        if (distance <= 2.5) return 1.0;
        return 0.75; // still allow other legal leaps
      });

      const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
      let pick = Math.random() * totalWeight;
      let selectedIndex = weights.length - 1;

      for (let i = 0; i < weights.length; i++) {
        pick -= weights[i];
        if (pick <= 0) {
          selectedIndex = i;
          break;
        }
      }

      ordered.push(remaining.splice(selectedIndex, 1)[0]);
    }

    return ordered;
  }

  // Generate one complete four-measure skeleton by recursive backtracking.
  // Required tones are enforced as soon as possible, and all special
  // measure-boundary rules are checked using the actual boundary notes.
  const allEvents = [];
  eventsByMeasure.forEach((events, m) => {
    events.forEach((item, i) => allEvents.push({ item, m, i }));
  });

  const requiredPitches = ["eb4", "ab4"];
  const requiredMeasure = 1; // A-flat major measure: require Eb4 or Ab4

  function solve(index, previousPitch, requiredSeen) {
    if (index === allEvents.length) {
      return requiredSeen.eNatural && requiredSeen.modalPitch;
    }

    const { item, m, i } = allEvents[index];

    let candidates = [...chords[m]];

    // The opening pitch may vary, but E-natural must appear in measure 1.
    // If this is the last note available in measure 1, enforce E4.
    if (m === 0 && !requiredSeen.eNatural) {
      const remainingInMeasure = eventsByMeasure[m].length - i;
      if (remainingInMeasure === 1) candidates = ["e4"];
      else if (index === 0) candidates = ["e4", ...chords[0].filter(p => p !== "e4")];
    }

    // First note of a later measure: apply boundary rules.
    if (i === 0 && m > 0) {
      const forced = forcedNext(previousPitch);
      if (forced !== null) {
        candidates = [forced];
      } else {
        candidates = candidates.filter(p => !isForbidden(previousPitch, p));
      }

      // Voice-leading constraint: if measure 1 ends on E4,
      // measure 2 cannot begin on Ab4.
      if (m === 1 && previousPitch === "e4") {
        candidates = candidates.filter(p => p !== "ab4");
      }

      // Voice-leading constraint: if measure 3 ends on A4,
      // measure 4 cannot begin on D4.
      if (m === 3 && previousPitch === "a4") {
        candidates = candidates.filter(p => p !== "d4");
      }
    }

    // Guarantee the required chromatic pitch appears in its measure.
    if (m === requiredMeasure && !requiredSeen.modalPitch) {
      const remainingInMeasure = eventsByMeasure[m].length - i;
      const requiredAvailable = requiredPitches.filter(p => candidates.includes(p));
      if (remainingInMeasure === 1) {
        candidates = requiredAvailable.length
          ? requiredAvailable
          : requiredPitches.filter(p => chords[m].includes(p));
      } else if (requiredAvailable.length && Math.random() < 0.5) {
        candidates = requiredAvailable;
      }
    }

    candidates = weightedCandidateOrder(candidates, previousPitch);

    for (const candidate of candidates) {
      if (!legalInterval(previousPitch, candidate) && index !== 0) continue;

      // Boundary-specific restrictions apply to the first note of a measure.
      if (i === 0 && m > 0) {
        const forced = forcedNext(previousPitch);
        if (forced !== null && candidate !== forced) continue;
        if (isForbidden(previousPitch, candidate)) continue;
      }

      // The "last pitch of measure -> first pitch of next measure" rules
      // are checked naturally when the next event is selected.
      item.pitch = candidate;

      const seen = {
        eNatural: requiredSeen.eNatural || (m === 0 && candidate === "e4"),
        modalPitch: requiredSeen.modalPitch ||
          (m === requiredMeasure && requiredPitches.includes(candidate))
      };

      if (solve(index + 1, candidate, seen)) return true;

      delete item.pitch;
    }

    return false;
  }

  for (let attempt = 0; attempt < 100; attempt++) {
    allEvents.forEach(x => delete x.item.pitch);

    if (solve(0, "c4", { eNatural: false, modalPitch: false })) {
      // Final measure: whole-note C, choosing the octave nearest the last
      // melody pitch in measure 4.
      const lastPitch = eventsByMeasure[3][eventsByMeasure[3].length - 1].pitch;
      const finalC =
        Math.abs(pitchValue[lastPitch] - pitchValue["c4"]) <=
        Math.abs(pitchValue[lastPitch] - pitchValue["c5"])
          ? "c4"
          : "c5";

      measures[4][0].pitch = finalC;
      return;
    }
  }

  throw new Error("Could not generate a melody satisfying all constraints.");
}


// =========================================
// PASSING-TONE FILL
//
// C-E -> C-D-E
// G-E -> G-F-E
//
// Only quarter + quarter pairs are filled so the
// two-beat cell remains exactly two beats.
// =========================================

function fillThirdsWithPassingTones(measures) {
  measures.forEach((measure, measureIndex) => {
    const result = [];

    for (let i = 0; i < measure.length; i++) {
      const current = measure[i];
      const next = measure[i + 1];

      // With a 50% chance, expand an ascending diatonic fourth between
      // two quarter notes into four ascending stepwise eighth notes.
      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.beats === 1 &&
        next.beats === 1
      ) {
        const parsePitch = pitch => {
          const match = /^([a-g])([#b]?)(-?\d+)$/.exec(pitch);
          return match ? { letter: match[1], accidental: match[2], octave: Number(match[3]) } : null;
        };
        const letterOrder = { c: 0, d: 1, e: 2, f: 3, g: 4, a: 5, b: 6 };
        const startPitch = parsePitch(current.pitch);
        const endPitch = parsePitch(next.pitch);
        const startStep = startPitch ? startPitch.octave * 7 + letterOrder[startPitch.letter] : null;
        const endStep = endPitch ? endPitch.octave * 7 + letterOrder[endPitch.letter] : null;
        const eventAfterPair = measure[i + 2];
        const followingPitch = eventAfterPair && eventAfterPair.type === "note"
          ? parsePitch(eventAfterPair.pitch)
          : null;
        const followingStep = followingPitch
          ? followingPitch.octave * 7 + letterOrder[followingPitch.letter]
          : null;
        const followingNoteSupportsFigure =
          followingStep !== null &&
          (
            Math.abs(followingStep - startStep) === 1 ||
            Math.abs(followingStep - endStep) === 1
          );

        if (
          startPitch &&
          endPitch &&
          endStep - startStep === 3 &&
          followingNoteSupportsFigure &&
          Math.random() < 0.5
        ) {
          let scaleLetters = ["c", "d", "e", "f", "g", "a", "b"];
          const sequence = [];

          for (let step = 0; step <= 3; step++) {
            const absoluteStep = startStep + step;
            const octave = Math.floor(absoluteStep / 7);
            const letter = scaleLetters[absoluteStep % 7];
            sequence.push(letter + octave);
          }

          // In the A-flat-major measure, spell Eb4-Ab4 as Eb-F-G-Ab.
          if (
            measureIndex === 1 &&
            current.pitch === "eb4" &&
            next.pitch === "ab4"
          ) {
            sequence[0] = "eb4";
            sequence[1] = "f4";
            sequence[2] = "g4";
            sequence[3] = "ab4";
          } else {
            sequence[0] = current.pitch;
            sequence[3] = next.pitch;
          }

          sequence.forEach(pitch => {
            result.push({ type: "note", pitch, beats: 0.5, meiDur: 8 });
          });
          i++;
          continue;
        }
      }

      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.beats === 1 &&
        next.beats === 1
      ) {
        const currentNumber = pitchNameToNumber(current.pitch);
        const nextNumber = pitchNameToNumber(next.pitch);
        const cEbPair =
          (current.pitch === "c4" && next.pitch === "eb4") ||
          (current.pitch === "eb4" && next.pitch === "c4");

        if (
          cEbPair ||
          (
            Number.isInteger(currentNumber) &&
            Number.isInteger(nextNumber) &&
            (
              Math.abs(nextNumber - currentNumber) === 2 ||
              (current.pitch === "ab4" && next.pitch === "c5")
            )
          )
        ) {
          const passingNumber =
            (currentNumber + nextNumber) / 2;

          result.push({
            type: "note",
            pitch: current.pitch,
            beats: 0.5,
            meiDur: 8
          });

          let passingPitch = numberToPitchName(passingNumber);

          // Modal-interchange passing tones:
          // Ab4-C5 uses Bb4, while C4-Eb4 (in either direction)
          // uses D4.
          if (current.pitch === "ab4" && next.pitch === "c5") {
            passingPitch = "bb4";
          } else if (cEbPair) {
            passingPitch = "d4";
          }

          result.push({
            type: "note",
            pitch: passingPitch,
            beats: 0.5,
            meiDur: 8
          });

          result.push({
            type: "note",
            pitch: next.pitch,
            beats: 1,
            meiDur: 4
          });

          i++;
          continue;
        }
      }

      result.push(current);
    }

    measure.length = 0;
    measure.push(...result);
  });
}


// =========================================
// NEIGHBOR-TONE FILL
//
// C-C -> C-D-C
// E-E -> E-F-E
//
// Uses eighth + eighth + quarter,
// preserving the original two-beat span.
//
// The neighbor is diatonic and may be a
// non-chord tone.
// =========================================

function addNeighborToRepeatedPitches(measures) {
  measures.forEach(measure => {
    const result = [];

    for (let i = 0; i < measure.length; i++) {
      const current = measure[i];
      const next = measure[i + 1];

      // Repeated-pitch neighbor tones:
      // quarter + quarter -> eighth + eighth + quarter
      // quarter + half -> eighth + eighth + half
      // E-flat may use D or F; A-flat uses its lower neighbor G.
      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.pitch === next.pitch &&
        current.beats === 1 &&
        (next.beats === 1 || next.beats === 2)
      ) {
        let neighborCandidates = [];

        if (current.pitch === "eb4") {
          neighborCandidates = ["d4"];
        } else if (current.pitch === "ab4") {
          neighborCandidates = ["g4", "bb4"];
        } else if (!/[#b]/.test(current.pitch.slice(1))) {
          const currentNumber = pitchNameToNumber(current.pitch);
          if (Number.isFinite(currentNumber)) {
            if (currentNumber > 0) neighborCandidates.push(currentNumber - 1);
            if (currentNumber < 7) neighborCandidates.push(currentNumber + 1);
          }
          neighborCandidates = neighborCandidates.map(numberToPitchName).filter(Boolean);
        }

        const neighborPitch = randomChoice(neighborCandidates);

        if (neighborPitch) {
          result.push(
            { type: "note", pitch: current.pitch, beats: 0.5, meiDur: 8 },
            { type: "note", pitch: neighborPitch, beats: 0.5, meiDur: 8 },
            { type: "note", pitch: next.pitch, beats: next.beats, meiDur: next.meiDur }
          );
          i++;
          continue;
        }
      }

      result.push(current);
    }

    measure.length = 0;
    measure.push(...result);
  });
}


// =========================================
// COMPLETE MELODY
// =========================================

function chooseProgression() {
  selectedProgression = Math.floor(Math.random() * chordProgressions.length);
  chords = chordProgressions[selectedProgression];
}

// The progression contains one chromatic chord tone that must actually
// appear in the generated melody.
const requiredMelodyPitches = {
  0: { measure: 1, pitch: "eb4 or ab4" } // A-flat major: E-flat or A-flat in measure 2
};

function absorbBeatThreeQuarterRests(measures) {
  measures.forEach(measure => {
    let elapsedBeats = 0;

    for (let i = 0; i < measure.length; i++) {
      const event = measure[i];

      // If a quarter rest begins on beat 3, add its beat to the
      // immediately preceding note and remove the rest.
      if (
        event.type === "rest" &&
        event.beats === 1 &&
        elapsedBeats === 2 &&
        i > 0 &&
        measure[i - 1].type === "note"
      ) {
        const previous = measure[i - 1];
        previous.beats += 1;

        if (previous.beats === 2) {
          previous.meiDur = 2;
          delete previous.dots;
        } else if (previous.beats === 3) {
          previous.meiDur = 2;
          previous.dots = 1;
        }

        measure.splice(i, 1);
        i--;
        // The removed rest does not advance the measure's beat count.
        continue;
      }

      elapsedBeats += event.beats;
    }
  });
}

function createRandomMelody() {
  chooseProgression();
  const measures = [];
  let previousCell = null;

  for (let measureNumber = 0; measureNumber < 4; measureNumber++) {
    const firstChoice = randomRhythmCell(previousCell);
    const firstCell = firstChoice.notes;
    previousCell = firstChoice.source;

    let secondCell;

    const secondChoice = randomRhythmCell(previousCell);
    secondCell = secondChoice.notes;
    previousCell = secondChoice.source;

    measures.push([...firstCell, ...secondCell]);
  }

  absorbBeatThreeQuarterRests(measures);

  // Final measure: whole-note C (tonic).
  measures.push([
    { type: "note", pitch: "c4", beats: 4, meiDur: 1 }
  ]);

  // Base harmony.
  generatePitches(measures);

  // Embellishment layer.
  fillThirdsWithPassingTones(measures);
  addNeighborToRepeatedPitches(measures);

  return measures;
}


// =========================================
// MEI HELPERS
// =========================================

function pitchToMEI(pitch) {
  const match = pitch.match(/^([a-g])([#b]?)(\d)$/);
  if (!match) {
    throw new Error(`Invalid pitch name: ${pitch}`);
  }

  return {
    pname: match[1],
    accidental: match[2],
    oct: match[3]
  };
}

function makeEvent(event) {
  if (event.type === "rest") {
    return `<rest dur="${event.meiDur}"/>`;
  }

  const pitch = pitchToMEI(event.pitch);

  let accidentalMarkup = "";
  if (pitch.accidental === "#") accidentalMarkup = ' accid="s"';
  if (pitch.accidental === "b") accidentalMarkup = ' accid="f"';

  const dotMarkup = event.dots ? ` dots="${event.dots}"` : "";

  return `
    <note
      pname="${pitch.pname}"
      oct="${pitch.oct}"
      dur="${event.meiDur}"${accidentalMarkup}${dotMarkup}
    />
  `;
}


// =========================================
// CELL RENDERING
//
// Eighth pairs are explicitly beamed.
// =========================================

function renderCell(cell) {
  let output = "";
  let i = 0;

  while (i < cell.length) {
    const event = cell[i];
    const next = cell[i + 1];

    if (
      event.type === "note" &&
      event.beats === 0.5 &&
      next &&
      next.type === "note" &&
      next.beats === 0.5
    ) {
      output += `
        <beam>
          ${makeEvent(event)}
          ${makeEvent(next)}
        </beam>
      `;
      i += 2;
      continue;
    }

    output += makeEvent(event);
    i++;
  }

  return output;
}


// =========================================
// MELODY -> MEI
// =========================================

function melodyToMEI(measures) {
  let measureMarkup = "";

  measures.forEach((measure, index) => {
    let firstCell = [];
    let secondCell = [];
    let beats = 0;

    for (const event of measure) {
      if (beats < 2) {
        firstCell.push(event);
      } else {
        secondCell.push(event);
      }
      beats += event.beats;
    }

    measureMarkup += `
      <measure n="${index + 1}">
        <staff n="1">
          <layer n="1">
            ${renderCell(firstCell)}
            ${renderCell(secondCell)}
          </layer>
        </staff>
      </measure>
    `;
  });

  return `
    <?xml version="1.0" encoding="UTF-8"?>

    <mei
      xmlns="http://www.music-encoding.org/ns/mei"
      meiversion="5.0">

      <meiHead>
        <fileDesc>
          <titleStmt>
            <title>Random Melody</title>
          </titleStmt>
          <pubStmt/>
        </fileDesc>
      </meiHead>

      <music>
        <body>
          <mdiv>
            <score>
              <scoreDef meter.count="4" meter.unit="4">
                <staffGrp>
                  <staffDef
                    n="1"
                    lines="5"
                    clef.shape="G"
                    clef.line="2"
                  />
                </staffGrp>
              </scoreDef>

              <section>
                ${measureMarkup}
              </section>
            </score>
          </mdiv>
        </body>
      </music>
    </mei>
  `;
}


// =========================================
// GENERATE + RENDER
// =========================================

function generateMelody() {
  try {
    const melody = createRandomMelody();
    console.log("Generated melody:", melody);

    const mei = melodyToMEI(melody);
    console.log("MEI:", mei);

    const svg = toolkit.renderData(mei, {});
    return svg;
  } catch (error) {
    console.error(error);
    return '<p>There was an error generating the melody. Please try again.</p>';
  }
}
  return generateMelody;
}

const generateButton = document.getElementById("generate");
const status = document.getElementById("status");
const notation = document.getElementById("notation");
let generators = [];
let toolkit = null;
let lastGenerator = -1;

function generateNewMelody() {
  if (!toolkit || generators.length !== 3) return;
  generateButton.disabled = true;
  status.textContent = "Generating melody…";
  try {
    let selected = Math.floor(Math.random() * generators.length);
    if (generators.length > 1 && selected === lastGenerator) {
      selected = (selected + 1 + Math.floor(Math.random() * (generators.length - 1))) % generators.length;
    }
    lastGenerator = selected;
    const svg = generators[selected]();
    notation.innerHTML = svg;
    status.textContent = "";
  } catch (error) {
    console.error(error);
    status.textContent = "The melody could not be generated. Please try again.";
  } finally {
    generateButton.disabled = false;
    generateButton.textContent = "Generate New Melody";
  }
}

generateButton.addEventListener("click", generateNewMelody);

verovio.module.onRuntimeInitialized = () => {
  try {
    toolkit = new verovio.toolkit();
    toolkit.setOptions({
      scale: 40,
      adjustPageWidth: true,
      pageMarginTop: 50,
      pageMarginBottom: 50,
      pageMarginLeft: 50,
      pageMarginRight: 50
    });
    generators = [
      makeGenerator1(toolkit),
      makeGenerator2(toolkit),
      makeGenerator3(toolkit)
    ];
    generateButton.textContent = "Generate New Melody";
    generateButton.disabled = false;
    generateNewMelody();
  } catch (error) {
    console.error(error);
    generateButton.textContent = "Initialization failed";
    status.textContent = "Notation could not initialize. Check your internet connection and reload the page.";
  }
};
